<!doctype html>
<meta charset="UTF-8" />
<html lang="en">
    <head>
        <title>democapsid</title>
        <style>
            * {
                font-family: monospace;
                text-transform: full-width;
            }

            .container {
                display: grid;
                grid-template-columns: 2.5% 30% 65% 2.5%;
                grid-template-areas:
                    ". controller model ."
                    ". console model .";
            }
            .subcontainer {
                display: grid;
                grid-template-columns: 50% 50%;
                grid-template-areas: ". .";
            }
            .subcontainer > * {
                min-width: 0;
            }
            .controller {
                grid-area: controller;
            }
            .model {
                grid-area: model;
            }
            .console {
                grid-area: console;
                height: 200px;
            }

            fieldset {
                height: 100%;
            }
            .param {
                display: flex;
                width: 100%;
            }
            .param label {
                padding-right: 5px;
            }
            .param input,
            select {
                width: 100%;
            }

            legend {
                font-weight: bold;
                box-sizing: border-box;
                white-space: normal;
                overflow-wrap: break-word;
                word-break: break-word;
            }
            button,
            label,
            legend,
            fieldset,
            input,
            radio,
            select {
                align-items: center;
                border-radius: 5px;
                border-width: 1px;
                box-sizing: border-box;
                vertical-align: middle;
            }

            .canvas-wrapper {
                width: 100%;
                height: 100%;
                overflow: hidden;
            }
            .canvas-wrapper canvas {
                display: block;
                width: 100%;
                height: 100%;
            }

            .inlined {
                display: flex;
                width: 100%;
            }
            .swatch {
                display: flex;
                width: 100%;
            }
            .swatch input[type="color"] {
                width: 70%;
            }
            .swatch input[type="number"] {
                width: 30%;
            }
            #param_width {
                width: 100%;
            }

            div.subcontainer:nth-child(3) {
                height: 250px;
            }
        </style>
        <script type="text/javascript" src="js/lib/chroma/chroma.min.cjs"></script>
        <script type="text/javascript" src="js/lib/paper/paper-core.min.js"></script>
        <script type="text/javascript" src="js/array.js"></script>
        <script type="text/javascript" src="js/numerical.js"></script>
        <script type="text/javascript" src="js/util.js"></script>
        <script type="text/javascript" src="js/graph.js"></script>
        <script type="text/javascript" src="js/ico.js"></script>
        <script type="text/javascript" src="js/wythoff.js"></script>
        <script type="text/javascript" src="js/capsid.js"></script>
        <script type="text/javascript" src="js/main.js"></script>
    </head>
    <body>
        <div class="container">
            <div class="controller">
                <div>
                    <fieldset>
                        <legend>&#11041;&#11042;</legend>
                        <a href="https://github.com/dnanto/democapsid">democapsid v0.0.0</a>
                    </fieldset>
                </div>
                <div class="subcontainer">
                    <fieldset>
                        <legend>lattice</legend>
                        <div class="param">
                            <label for="param_h">h=</label>
                            <input type="number" id="param_h" step="1" value="1" min="0" />
                        </div>
                        <div class="param">
                            <label for="param_k">k=</label>
                            <input type="number" id="param_k" step="1" value="1" min="0" />
                        </div>
                        <div class="param">
                            <label for="param_H">H=</label>
                            <input type="number" id="param_H" step="1" value="1" min="0" />
                        </div>
                        <div class="param">
                            <label for="param_K">K=</label>
                            <input type="number" id="param_K" step="1" value="2" min="0" />
                        </div>
                        <div class="param">
                            <label for="param_R">R=</label>
                            <input type="number" id="param_R" step="1" value="25" min="1" />
                        </div>
                        <div class="param">
                            <label for="param_t">t=</label>
                            <select id="param_t">
                                <option value="levo">levo</option>
                                <option value="dextro">dextro</option>
                            </select>
                        </div>
                        <div class="param">
                            <label for="param_L">L=</label>
                            <select id="param_L"></select>
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>aesthetics</legend>
                        <div class="inlined">
                            <select id="scale"></select>
                            <button id="reverse">Reverse</button>
                        </div>
                        <div id="palette">
                            <div class="swatch">
                                <input type="color" />
                                <input type="number" min="0" max="255" value="200" />
                            </div>
                            <div class="swatch">
                                <input type="color" />
                                <input type="number" min="0" max="255" value="200" />
                            </div>
                            <div class="swatch">
                                <input type="color" />
                                <input type="number" min="0" max="255" value="200" />
                            </div>
                            <div class="swatch">
                                <input type="color" />
                                <input type="number" min="0" max="255" value="255" />
                            </div>
                        </div>
                        <input id="param_width" type="number" min="0" value="1" step="0.25" />
                        <div class="param">
                            <select id="param_outline">
                                <option value="on">&bigtriangleup; outline on</option>
                                <option value="off" selected>&bigtriangledown; outline off</option>
                            </select>
                        </div>
                    </fieldset>
                </div>
                <div class="subcontainer">
                    <fieldset>
                        <legend>fundamental-&bigtriangleup;</legend>
                        <div class="canvas-wrapper">
                            <canvas id="wythoff">Your browser does not support the HTML canvas tag.</canvas>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>kaleidoscope</legend>
                        <div class="canvas-wrapper">
                            <canvas id="kaleidoscope">Your browser does not support the HTML canvas tag.</canvas>
                        </div>
                    </fieldset>
                </div>
                <div class="subcontainer">
                    <fieldset>
                        <legend>icosahedron</legend>
                        <div class="param">
                            <label for="param_a">a=</label>
                            <select id="param_a">
                                <option value="5">5</option>
                                <option value="3">3</option>
                                <option value="2">2</option>
                            </select>
                        </div>
                        <div class="param">
                            <label for="param_s">s=</label>
                            <input type="range" min="-1" max="1" step="0.001" value="0" id="param_s" />
                        </div>
                        <div>&nbsp;&nbsp;&equals;&nbsp;<span id="display_s"></span></div>
                    </fieldset>
                    <fieldset>
                        <legend>camera</legend>
                        <div class="param">
                            <label for="θ">θ=</label>
                            <input type="number" id="param_θ" step="1" value="0" />
                            &deg;
                        </div>
                        <div class="param">
                            <label for="ψ">ψ=</label>
                            <input type="number" id="param_ψ" step="1" value="0" />
                            &deg;
                        </div>
                        <div class="param">
                            <label for="φ">φ=</label>
                            <input type="number" id="param_φ" step="1" value="90" />
                            &deg;
                        </div>
                    </fieldset>
                </div>
                <div class="subcontainer">
                    <fieldset>
                        <legend>mode</legend>
                        <div class="param">
                            <select id="param_mode">
                                <option value="icosahedron">icosahedron</option>
                                <option value="lattice">lattice</option>
                            </select>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>export</legend>
                        <button id="download-btn">Download</button>
                        <button id="download-btn">Citation</button>
                    </fieldset>
                </div>
            </div>
            <div class="model">
                <div class="canvas-wrapper">
                    <fieldset>
                        <legend>model</legend>
                        <canvas id="model">Your browser does not support the HTML canvas tag.</canvas>
                    </fieldset>
                </div>
            </div>
            <div class="console">
                <fieldset>
                    <legend>console</legend>
                    <div id="console"></div>
                </fieldset>
            </div>
        </div>
    </body>
</html>
