<!doctype html>
<meta charset="UTF-8" />
<html lang="en">
    <head>
        <title>democapsid</title>
        <link rel="stylesheet" href="css/app.css" />
        <script type="text/javascript" src="js/lib/chroma/chroma.min.cjs"></script>
        <script type="text/javascript" src="js/lib/paper/paper-core.min.js"></script>
        <script type="text/javascript" src="js/lib/qr-code-styling/qr-code-styling.js"></script>
        <script type="text/javascript" src="js/array.js"></script>
        <script type="text/javascript" src="js/numerical.js"></script>
        <script type="text/javascript" src="js/util.js"></script>
        <script type="text/javascript" src="js/graph.js"></script>
        <script type="text/javascript" src="js/ico.js"></script>
        <script type="text/javascript" src="js/wythoff.js"></script>
        <script type="text/javascript" src="js/capsid.js"></script>
        <script type="text/javascript" src="js/main.js"></script>
    </head>
    <body>
        <div id="header">
            <fieldset>
                <legend>&#11041;&#11042;</legend>
                <a href="https://github.com/dnanto/democapsid">democapsid v3.0.0</a>
            </fieldset>
        </div>
        <div class="container">
            <div class="controller">
                <div class="subcontainer">
                    <fieldset>
                        <legend>parameters</legend>
                        <div class="param">
                            <label for="param_h">h=</label>
                            <input type="number" id="param_h" step="1" value="1" min="0" />
                        </div>
                        <div class="param">
                            <label for="param_k">k=</label>
                            <input type="number" id="param_k" step="1" value="1" min="0" />
                        </div>
                        <div class="param">
                            <label for="param_H">H=</label>
                            <input type="number" id="param_H" step="1" value="1" min="0" />
                        </div>
                        <div class="param">
                            <label for="param_K">K=</label>
                            <input type="number" id="param_K" step="1" value="2" min="0" />
                        </div>
                        <div class="param">
                            <label for="param_R">R=</label>
                            <input type="number" id="param_R" step="1" value="50" min="1" />
                        </div>
                        <div class="param">
                            <label for="param_t">t=</label>
                            <select id="param_t">
                                <option value="levo">levo</option>
                                <option value="dextro">dextro</option>
                            </select>
                        </div>
                        <div class="param">
                            <label for="param_L">L=</label>
                            <select id="param_L"></select>
                        </div>
                        <hr />
                        <div class="param">
                            <label for="param_a">a=</label>
                            <select id="param_a">
                                <option value="5">5</option>
                                <option value="3">3</option>
                                <option value="2">2</option>
                            </select>
                        </div>
                        <div class="param">
                            <label for="param_s">s=</label>
                            <input type="range" min="-1" max="1" step="0.001" value="0" id="param_s" />
                            (<span id="display_s"></span>)
                        </div>
                        <hr />
                        <div class="param">
                            <label for="param_mode">m=</label>
                            <select id="param_mode">
                                <option value="ico">icosahedron</option>
                                <option value="net">net</option>
                            </select>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>aesthetics</legend>
                        <div>
                            <select id="scale"></select>
                        </div>
                        <div>
                            <button id="reverse">Reverse</button>
                        </div>
                        <div id="palette">
                            <div class="swatch">
                                <input type="color" />
                                <input type="number" min="0" max="255" value="200" />
                            </div>
                            <div class="swatch">
                                <input type="color" />
                                <input type="number" min="0" max="255" value="200" />
                            </div>
                            <div class="swatch">
                                <input type="color" />
                                <input type="number" min="0" max="255" value="200" />
                            </div>
                            <div class="swatch">
                                <input type="color" />
                                <input type="number" min="0" max="255" value="255" />
                            </div>
                        </div>
                        <input id="param_width" type="number" min="0" value="1" step="0.25" />
                        <div class="param">
                            <select id="param_outline">
                                <option value="on">&bigtriangleup; outline on</option>
                                <option value="off" selected>&bigtriangledown; outline off</option>
                            </select>
                        </div>
                        <hr />
                        <div id="camera">
                            &lpar;
                            <!---->
                            <input type="number" id="param_θ" step="1" value="0" />&comma;
                            <!---->
                            <input type="number" id="param_ψ" step="1" value="0" />&comma;
                            <!---->
                            <input type="number" id="param_φ" step="1" value="90" />
                            &rpar; &deg;
                        </div>
                    </fieldset>
                </div>
                <div class="subcontainer">
                    <fieldset class="resize">
                        <legend>fundamental-&bigtriangleup;</legend>
                        <div class="render">
                            <canvas id="wythoff">Your browser does not support the HTML canvas tag.</canvas>
                        </div>
                    </fieldset>
                    <fieldset class="resize">
                        <legend>kaleidoscope</legend>
                        <div class="render">
                            <canvas id="kaleidoscope">Your browser does not support the HTML canvas tag.</canvas>
                        </div>
                    </fieldset>
                </div>
                <div class="subcontainer">
                    <fieldset class="console">
                        <legend>console</legend>
                        <textarea id="console" readonly></textarea>
                    </fieldset>
                    <fieldset>
                        <legend>export</legend>
                        <div id="qr-code-container"></div>
                        <select id="qr-code-image">
                            <option value="kaleidoscope">kaleidoscope</option>
                            <option value="model">model</option>
                            <option value="none">none</option>
                        </select>
                        <hr />
                        <div class="choose">
                            <button id="download-btn">
                                Download <b><u>&#8623;</u></b>
                            </button>
                            <select id="download-fmt">
                                <option value="model.svg">model.svg</option>
                                <option value="csv">model.csv</option>
                                <option value="tsv">model.tsv</option>
                                <option value="json">model.json</option>
                                <option value="py">model.py</option>
                                <option value="qr.svg">qr.svg</option>
                                <option value="bib">citation.bib</option>
                            </select>
                        </div>
                        <hr />
                        <span id="linkspan">
                            <a id="link" href="">&lt;link&gt;</a>
                        </span>
                    </fieldset>
                </div>
            </div>
            <div class="model">
                <fieldset>
                    <legend>model</legend>
                    <div class="render">
                        <canvas id="model">Your browser does not support the HTML canvas tag.</canvas>
                    </div>
                </fieldset>
            </div>
        </div>
    </body>
</html>
